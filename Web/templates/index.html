<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CNC Smart Writer — Document-to-Motion Control Studio</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body data-theme="obsidian" class="min-h-screen flex flex-col antialiased selection:bg-orange-500/30">
  <header class="sticky top-0 z-40 border-b backdrop-blur-xl" style="border-color: var(--border-hairline); background: var(--bg-card);">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center shadow-md transition-transform group-hover:scale-105" style="background: var(--accent-gradient); color: var(--accent-fg);">
          <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m12 18.5 7.2-7.2L22 4l-7.3 2.8-7.2 7.3-2 7.2 6.5-2.8Z"/>
            <path d="m14.7 7.1 3.1 3.1M7.5 14.3l4.7 4.7"/>
            <path d="M3 20.5c.8-1.2 1.8-1.8 3-1.8"/>
          </svg>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-base sm:text-lg font-bold tracking-tight">CNC Smart Writer</span>
            <span class="font-mono-tech text-[10px] font-semibold px-2 py-0.5 rounded-full" style="background: var(--accent-soft); color: var(--accent);">English</span>
          </div>
        </div>
      </div>
      <nav aria-label="Workflow Steps" class="pointer-events-none flex items-center gap-1 p-1 rounded-xl border order-3 sm:order-2 w-full sm:w-auto justify-center" style="border-color: var(--border-hairline); background: var(--bg-input);">
        <span class="px-3 py-1.5 rounded-lg text-xs font-semibold" style="background: var(--bg-elevated); color: var(--text-main); box-shadow: 0 2px 6px rgba(0,0,0,0.12);" aria-current="step">01 Input</span>
        <span class="px-3 py-1.5 rounded-lg text-xs font-medium" style="color: var(--text-muted);">02 Processing</span>
        <span class="px-3 py-1.5 rounded-lg text-xs font-medium" style="color: var(--text-muted);">03 Output</span>
      </nav>
      <button type="button" onclick="toggleTheme()" id="theme-toggle-btn" class="order-2 sm:order-3 px-3.5 py-2 rounded-xl text-xs font-semibold btn-ghost flex items-center gap-2 cursor-pointer" title="Switch Theme">
        <span id="theme-icon" class="w-4 h-4 flex items-center justify-center" style="color: var(--accent);"></span>
        <span id="theme-label">Bento Light</span>
      </button>
    </div>
  </header>

  <main class="flex-1 w-full mx-auto px-4 sm:px-6 py-8 sm:py-12 flex flex-col justify-center">
    <section id="screen-1" class="w-full max-w-[680px] mx-auto space-y-7 my-auto">
      <div class="text-center space-y-2.5">
        <h1 class="text-3xl sm:text-4xl font-bold tracking-tight">Prepare text for precise motion.</h1>
        <p class="text-sm sm:text-base max-w-lg mx-auto" style="color: var(--text-muted);">Convert a document or text into reviewed plotter G-Code.</p>
      </div>

      <form class="studio-card p-6 sm:p-8 space-y-6" action="{{ url_for('process_document') }}" method="post" enctype="multipart/form-data" id="input-form">
        <div class="tab-track grid grid-cols-2 gap-1">
          <input type="hidden" name="language" value="en">
          <button type="button" id="tab-file" onclick="switchInputTab('file')" class="tab-item active py-2.5 px-4 text-xs font-semibold flex items-center justify-center gap-2 cursor-pointer" aria-selected="true">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
            <span>Upload File / Image</span>
          </button>
          <button type="button" id="tab-text" onclick="switchInputTab('text')" class="tab-item py-2.5 px-4 text-xs font-semibold flex items-center justify-center gap-2 cursor-pointer" aria-selected="false">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            <span>Direct Text Input</span>
          </button>
        </div>

        <div id="panel-file" class="space-y-3">
          <input type="file" id="hidden-file-input" name="document" class="hidden" accept=".pdf,.docx,.txt,.png,.jpg,.jpeg">
          <div id="drop-area" role="button" tabindex="0" aria-label="Choose a PDF or image or drop it here" class="group cursor-pointer rounded-2xl border border-dashed p-9 text-center transition-all" style="border-color: var(--border-strong); background: var(--bg-input);">
            <div class="w-11 h-11 rounded-xl mx-auto mb-3 flex items-center justify-center transition-transform group-hover:scale-105" style="background: var(--accent-soft); color: var(--accent);">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>
            </div>
            <p class="text-sm font-medium">Drop a document or image here, or <span style="color: var(--accent);" class="underline underline-offset-4">select a file</span></p>
            <p class="font-mono-tech text-[11px] mt-1.5" style="color: var(--text-dim);">PDF, DOCX, TXT, PNG, JPG • MAX 16 MB</p>
          </div>

          <div id="file-validation-error" role="alert" class="hidden rounded-xl border p-3.5 text-xs" style="border-color: #ef4444; color: #ef4444; background: rgba(239, 68, 68, 0.08);"></div>
          <div id="selected-file-bar" class="hidden p-3.5 studio-panel flex items-center justify-between gap-3" aria-live="polite">
            <div class="flex items-center gap-3 min-w-0">
              <div class="w-9 h-9 rounded-lg flex items-center justify-center font-mono-tech text-xs font-bold shrink-0" style="background: var(--accent-soft); color: var(--accent);">DOC</div>
              <div class="truncate">
                <div id="file-name-label" class="text-xs font-semibold truncate"></div>
                <div id="file-size-label" class="mt-1 w-fit px-2 py-0.5 rounded-md studio-panel font-mono-tech text-[11px]" style="color: var(--text-muted);"></div>
              </div>
            </div>
            <button type="button" onclick="clearAllInputs()" class="px-3 py-1.5 text-xs font-semibold btn-ghost shrink-0 cursor-pointer" title="Remove file">Clear ×</button>
          </div>
        </div>

        <div id="panel-text" class="hidden space-y-2">
          <div class="flex items-center justify-end">
            <div class="flex items-center gap-3">
              <span id="live-char-count" class="font-mono-tech text-[11px]" style="color: var(--text-dim);">0 characters</span>
              <button type="button" id="clear-text-btn" onclick="clearAllInputs()" class="hidden px-2.5 py-1 text-xs font-semibold btn-ghost cursor-pointer">Clear ×</button>
            </div>
          </div>
          <textarea id="direct-text-input" name="direct_text" rows="5" aria-label="Direct text input" placeholder="Type or paste the text you want to prepare for CNC output..." class="w-full p-4 text-sm font-mono-tech studio-input resize-none"></textarea>
        </div>

        {% if error %}
        <div role="alert" class="rounded-xl border p-3.5 text-xs" style="border-color: var(--accent); color: var(--accent); background: var(--accent-soft);">{{ error }}</div>
        {% endif %}

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <label class="p-3.5 studio-panel cursor-pointer flex items-center gap-3">
            <input type="radio" name="processing_mode" value="as_is" checked class="accent-orange-500 w-4 h-4">
            <div>
              <div class="text-xs font-semibold">Keep Text As-Is</div>
            </div>
          </label>
          <label class="p-3.5 studio-panel cursor-pointer flex items-center gap-3">
            <input type="radio" name="processing_mode" value="summarize" class="accent-orange-500 w-4 h-4">
            <div>
              <div class="text-xs font-semibold">Summarize</div>
            </div>
          </label>
        </div>

        <button type="submit" id="analyze-btn" disabled class="w-full py-3.5 px-6 text-sm btn-accent flex items-center justify-center gap-2 cursor-pointer">
          <span>Processing</span>
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m13 6 6 6-6 6"/></svg>
        </button>
      </form>
    </section>
  </main>

  <script>
    const body = document.body;
    const sunIcon = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path stroke-linecap="round" d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>';
    const moonIcon = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path></svg>';
    let currentTheme = localStorage.getItem("cnc-smart-writer-theme") || "obsidian";
    if (!["obsidian", "bento"].includes(currentTheme)) currentTheme = "obsidian";

    function setTheme(theme) {
      currentTheme = theme;
      body.setAttribute("data-theme", theme);
      document.getElementById("theme-label").textContent = theme === "obsidian" ? "Bento Light" : "Obsidian Dark";
      document.getElementById("theme-icon").innerHTML = theme === "obsidian" ? sunIcon : moonIcon;
      localStorage.setItem("cnc-smart-writer-theme", theme);
    }

    function toggleTheme() {
      setTheme(currentTheme === "obsidian" ? "bento" : "obsidian");
    }

    setTheme(currentTheme);

    const fileInput = document.getElementById("hidden-file-input");
    const textInput = document.getElementById("direct-text-input");
    const analyzeButton = document.getElementById("analyze-btn");
    const fileError = document.getElementById("file-validation-error");
    function clearAllInputs() {
      fileInput.value = "";
      textInput.value = "";
      document.getElementById("selected-file-bar").classList.add("hidden");
      fileError.classList.add("hidden");
      fileError.textContent = "";
      document.getElementById("live-char-count").textContent = "0 characters";
      document.getElementById("clear-text-btn").classList.add("hidden");
      analyzeButton.disabled = true;
    }

    function switchInputTab(tabName) {
      clearAllInputs();
      document.getElementById("tab-file").classList.toggle("active", tabName === "file");
      document.getElementById("tab-text").classList.toggle("active", tabName === "text");
      document.getElementById("tab-file").setAttribute("aria-selected", String(tabName === "file"));
      document.getElementById("tab-text").setAttribute("aria-selected", String(tabName === "text"));
      document.getElementById("panel-file").classList.toggle("hidden", tabName !== "file");
      document.getElementById("panel-text").classList.toggle("hidden", tabName !== "text");
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return "0 B";
      return bytes < 1024 * 1024
        ? `${Math.max(1, Math.round(bytes / 1024))} KB`
        : `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function validateFile(file) {
      if (file.size > 16 * 1024 * 1024) {
        return "File rejected: the maximum file size is 16 MB.";
      }
      if (file.size === 0) {
        return "File rejected: the selected file is empty.";
      }
      const extension = file.name.split(".").pop().toLowerCase();
      const acceptedMimeTypes = {
        pdf: ["application/pdf"],
        docx: ["application/vnd.openxmlformats-officedocument.wordprocessingml.document"],
        txt: ["text/plain"],
        png: ["image/png"],
        jpg: ["image/jpeg"],
        jpeg: ["image/jpeg"]
      };
      if (!acceptedMimeTypes[extension]) {
        return "File rejected: unsupported file type. Choose PDF, DOCX, TXT, PNG, JPG, or JPEG.";
      }
      if (file.type && !acceptedMimeTypes[extension].includes(file.type.toLowerCase())) {
        return "File rejected: unsupported file type. Choose PDF, DOCX, TXT, PNG, JPG, or JPEG.";
      }
      return "";
    }

    function rejectFile(message) {
      fileInput.value = "";
      document.getElementById("selected-file-bar").classList.add("hidden");
      fileError.textContent = message;
      fileError.classList.remove("hidden");
      analyzeButton.disabled = true;
    }

    function onRealFileSelected(file) {
      if (!file) return;
      const validationError = validateFile(file);
      if (validationError) {
        rejectFile(validationError);
        return;
      }
      fileError.textContent = "";
      fileError.classList.add("hidden");
      document.getElementById("file-name-label").textContent = file.name;
      document.getElementById("file-size-label").textContent = formatFileSize(file.size);
      document.getElementById("selected-file-bar").classList.remove("hidden");
      analyzeButton.disabled = false;
    }

    fileInput.addEventListener("change", () => onRealFileSelected(fileInput.files[0]));
    textInput.addEventListener("input", () => {
      const value = textInput.value;
      document.getElementById("live-char-count").textContent = `${value.length} character${value.length === 1 ? "" : "s"}`;
      document.getElementById("clear-text-btn").classList.toggle("hidden", value.length === 0);
      analyzeButton.disabled = value.trim().length === 0;
    });

    const dropArea = document.getElementById("drop-area");
    dropArea.addEventListener("click", () => fileInput.click());
    dropArea.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        fileInput.click();
      }
    });
    dropArea.addEventListener("dragover", (event) => {
      event.preventDefault();
      dropArea.style.borderColor = "var(--accent)";
    });
    dropArea.addEventListener("dragleave", () => {
      dropArea.style.borderColor = "var(--border-strong)";
    });
    dropArea.addEventListener("drop", (event) => {
      event.preventDefault();
      dropArea.style.borderColor = "var(--border-strong)";
      if (!event.dataTransfer.files.length) return;
      const droppedFile = event.dataTransfer.files[0];
      const validationError = validateFile(droppedFile);
      if (validationError) {
        rejectFile(validationError);
        return;
      }
      const acceptedFiles = new DataTransfer();
      acceptedFiles.items.add(droppedFile);
      fileInput.files = acceptedFiles.files;
      onRealFileSelected(droppedFile);
    });
  </script>
</body>
</html>
